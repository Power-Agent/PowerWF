name: Cross-engine transient workflow

on:
  push:
    branches:
      - feat/cross-engine-transient-workflow
  pull_request:
    paths:
      - "cross_engine_validation/**"
      - "tests/test_cross_engine_validation.py"
      - "tests/test_powerworld_adapter.py"
      - "Grid Impact Evaluation/src/agent/tools_pandapower.py"
      - "Grid Impact Evaluation/tests/test_contingency_analysis.py"
      - ".github/workflows/cross-engine-validation.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pandapower langchain-core pydantic numpy pandas ruff
      - name: Lint orchestration sources
        run: ruff check cross_engine_validation tests/test_cross_engine_validation.py
      - name: Run workflow and contingency regression tests
        run: |
          python -m pytest tests/test_cross_engine_validation.py -q
          python -m pytest "Grid Impact Evaluation/tests/test_contingency_analysis.py" -q
